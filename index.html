<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entregable 2 - Tareas</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">

    <header class="top">


      <h1>Mis tareas</h1>

      <p class="mini">Agrega tareas, márcalas como hechas o pendientes, y se guardan en localStorage.

      </p>

    </header>

    <section class="card">

      <form id="formTarea" class="form">

        <label class="label" for="inputTarea">Nueva tarea</label>
        <div class="row">


          <input id="inputTarea" class="input" type="text" placeholder="Ej: Comprar pan" autocomplete="off" />
          <button id="btnAgregar" class="btn" type="submit">Agregar</button>
        </div>

        <p id="msg" class="msg"></p>
      </form>


      <div class="tools">


        <div class="filters">

          <button class="chip" id="filtroTodas" type="button">Todas</button>
          <button class="chip" id="filtroPendientes" type="button">Pendientes</button>
          <button class="chip" id="filtroHechas" type="button">Hechas</button>
        </div>

        <div class="right">

          <span id="contador" class="counter">0</span>

          <button id="btnBorrarHechas" class="chip" type="button">Borrar hechas</button>

          <button id="btnLimpiar" class="chip danger" type="button">Borrar todo</button>


        </div>
      </div>

      <hr class="line" />

      <!-- aqui es donde van las tareas (pendientes y hechas) -->


      <ul id="listaTareas" class="list"></ul>
    </section>

    <footer class="foot">

      <small>Entregable 2 - JS + DOM + eventos + localStorage</small>

    </footer>
     </main>

     <!-- aqui enlazo mi main JS -->

  <script src="main.js"></script>
</body>
</html>
